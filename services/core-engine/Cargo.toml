[package]
name = "legal-engine"
publish = false
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# clause splitting, classification, risk and issues (the crate at the root of this repository)
alice-legal-ai = { path = "../.." }
# signed contract records and the chained audit log
alice-legal = { git = "https://github.com/ext-sakamoro/ALICE-Legal", rev = "fefecbd989c695fcfda3d90022cf5a33b9856922", version = "0.3" }
# the issuer DID (did:key of the signing key) and parsing of the counterparty DID
alice-identity = { git = "https://github.com/ext-sakamoro/ALICE-Identity", rev = "68b8141af2847ebbef87d87e9e20f46fff48b911", version = "1.2" }
# Ed25519 key, signature and SHA-256 (the same rev alice-legal and alice-identity take)
alice-sign = { git = "https://github.com/ext-sakamoro/ALICE-Sign", rev = "8a1b00d800082187a8693732a9ffb806c98814e7", version = "0.1" }
# wipes the seed text and bytes once the key is derived
zeroize = "1"
[dev-dependencies]
# drives the router in tests (ServiceExt::oneshot)
tower = { version = "0.5", features = ["util"] }

[features]
default = []
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
