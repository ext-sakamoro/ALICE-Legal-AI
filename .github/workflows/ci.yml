name: ALICE Legal AI CI
on:
  push: { branches: [main, 'ci/**'] }
  pull_request: { branches: [main] }
jobs:
  test-rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core-engine, api-gateway]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/${{ matrix.service }}
      - run: cd services/${{ matrix.service }} && cargo check
      - run: cd services/${{ matrix.service }} && cargo clippy --all-targets -- -D warnings
      # the engine's tests (the other service has none): a run that executes no test fails
      - name: Test (core-engine)
        if: matrix.service == 'core-engine'
        working-directory: services/core-engine
        shell: bash
        run: |
          set -o pipefail
          out=$(cargo test 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          passed=$(awk '/^test result:/ {n += $4} END {print n + 0}' <<<"$out")
          echo "passed: $passed"
          [ "$passed" -gt 0 ] || { echo "::error::no test ran"; exit 1; }
  # the alice-legal-ai crate at the root (clause splitting, classification, risk, issues)
  test-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test (a run that executes no test fails)
        shell: bash
        run: |
          set -o pipefail
          out=$(cargo test 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          passed=$(awk '/^test result:/ {n += $4} END {print n + 0}' <<<"$out")
          echo "passed: $passed"
          [ "$passed" -gt 0 ] || { echo "::error::no test ran"; exit 1; }

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # the lock decides what is installed: a package.json that drifted from package-lock.json fails here
      - run: cd frontend && npm ci
      - run: cd frontend && npm run type-check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
